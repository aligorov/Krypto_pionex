# Fail2ban jail for Pionex Control Bot (Docker container or systemd service)

[pionex-bot]
enabled  = true
port     = http,https,8080
filter   = pionex-bot
logpath  = /var/log/pionex-bot/*.log
# Or if reading directly from Docker container journal:
# backend = systemd
# journalmatch = CONTAINER_NAME=pionex_backend
maxretry = 5
findtime = 600
bantime  = 900
ignoreip = 127.0.0.1/8 ::1
