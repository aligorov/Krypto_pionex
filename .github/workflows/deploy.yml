name: Build & Push Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pionex-bot-backend:latest
            ghcr.io/${{ github.repository_owner }}/pionex-bot-backend:${{ github.sha }}

      - name: Build & Push Quant Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.quant
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pionex-bot-quant:latest
            ghcr.io/${{ github.repository_owner }}/pionex-bot-quant:${{ github.sha }}
