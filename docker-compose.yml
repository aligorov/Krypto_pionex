services:
  postgres:
    image: postgres:16-alpine
    container_name: pionex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pionex
      POSTGRES_DB: pionex_bot
      # Zero-ENV, Zero-secrets: the database is reachable only inside the
      # private compose network, so no password exists anywhere in the
      # project (nothing to commit, leak or rotate). Auth is the network
      # boundary itself; the extra superuser role is locked by migration
      # 0016. Never publish this container's port.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - default
      - crypto_bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pionex -d pionex_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pionex_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://pionex@postgres:5432/pionex_bot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - crypto_bot_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  quant-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.quant
    container_name: pionex_quant
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pionex@postgres:5432/pionex_bot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - crypto_bot_net

volumes:
  postgres_data:

networks:
  crypto_bot_net:
    external: true
    name: crypto-bot_bot-network
