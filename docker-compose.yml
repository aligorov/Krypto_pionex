services:
  postgres:
    image: postgres:16-alpine
    container_name: pionex_postgres
    environment:
      POSTGRES_USER: pionex
      POSTGRES_PASSWORD: pionex_password
      POSTGRES_DB: pionex_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pionex -d pionex_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pionex_backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pionex:pionex_password@postgres:5432/pionex_bot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  quant-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.quant
    container_name: pionex_quant
    environment:
      DATABASE_URL: postgres://pionex:pionex_password@postgres:5432/pionex_bot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
